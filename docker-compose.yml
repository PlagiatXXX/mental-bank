services:
  postgres:
    image: postgres:18-alpine
    container_name: mental-bank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mentalbank
      POSTGRES_PASSWORD: mentalbank
      POSTGRES_DB: mentalbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
